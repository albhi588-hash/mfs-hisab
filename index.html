<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MFS Hisab Cloud</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#10233f;--muted:#6b7890;--p:#2563eb;--g:#059669;--r:#dc2626;--b:#e5eaf1}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.top{height:68px;background:#fff;border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}
.brand{font-size:20px;font-weight:800}.brand:first-letter{font-size:25px}.wrap{max-width:1250px;margin:auto;padding:24px}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.auth-card,.card{background:#fff;border:1px solid var(--b);border-radius:18px;box-shadow:0 12px 35px #0f234114}
.auth-card{width:min(440px,100%);padding:32px}.muted,.note{color:var(--muted)}.note{font-size:12px;line-height:1.5}
label{display:block;font-weight:700;margin:15px 0 7px}input,select,textarea{width:100%;padding:12px;border:1px solid #d5deea;border-radius:11px;outline:0}textarea{min-height:80px}
.btn{border:0;padding:11px 16px;border-radius:10px;font-weight:750}.primary{background:var(--p);color:#fff}.success{background:var(--g);color:#fff}.danger{background:var(--r);color:#fff}.ghost{background:#eef3f9;color:#18304e}.small{padding:8px 11px;font-size:13px}
.actions{display:grid;gap:10px;margin-top:18px}.alert{padding:11px;border-radius:10px;background:#fff1f2;color:#b42318;margin:12px 0}.ok{background:#ecfdf3;color:#067647}
.nav{display:flex;gap:8px;overflow:auto;padding:14px 0}.nav button{background:#fff;border:1px solid var(--b);padding:10px 14px;border-radius:10px;font-weight:700;color:#34465e}.nav .active{background:#eaf1ff;color:#1d4ed8}
.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:repeat(2,1fr)}
.card{padding:18px}.stat-title{color:var(--muted);font-size:13px}.stat{font-size:27px;font-weight:850;margin-top:8px}.section{margin-top:16px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}.row{display:flex;align-items:center;gap:10px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--b);font-size:14px}th{color:var(--muted);font-size:12px}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:800}.in{background:#ecfdf3;color:#047857}.out{background:#fff1f2;color:#be123c}
.modal{position:fixed;inset:0;background:#0a142673;display:grid;place-items:center;padding:20px;z-index:20}.modalbox{width:min(620px,100%);background:#fff;border-radius:18px;padding:22px;max-height:90vh;overflow:auto}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.top{padding:0 14px}.wrap{padding:14px}.stats,.two{grid-template-columns:1fr}.auth-card{padding:24px}}
</style>
</head>
<body><div id="app"></div><div id="modal" class="modal hidden"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,addDoc,collection,query,where,getDocs,updateDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyCaMiE1Lu33a-CJTHBLu3gdTa-uLP_1xP0",authDomain:"dsohisab.firebaseapp.com",projectId:"dsohisab",storageBucket:"dsohisab.firebasestorage.app",messagingSenderId:"177531392674",appId:"1:177531392674:web:4866f17384fa979d4afdfb",measurementId:"G-BP5JPQN2VG"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let me=null,profile=null,active="dashboard",cache={customers:[],dsos:[],tx:[]};

function startupError(e){
  document.getElementById("app").innerHTML=`<div class="auth"><div class="auth-card"><div class="brand">📒 MFS Hisab Cloud</div><div class="alert">Firebase চালু হতে সমস্যা হয়েছে।<br><small>${esc(e?.message||e||"Unknown error")}</small></div><button class="btn primary" style="width:100%" onclick="location.reload()">Reload</button></div></div>`;
}
const money=n=>"৳ "+Number(n||0).toLocaleString("en-BD",{maximumFractionDigits:2});
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const date=t=>t?.toDate?t.toDate().toLocaleString("en-BD"):"-";
function toast(s,ok=false){let x=document.getElementById("toast");if(!x)return;x.textContent=s;x.className="alert "+(ok?"ok":"");x.classList.remove("hidden");setTimeout(()=>x.classList.add("hidden"),3000)}
function close(){document.getElementById("modal").classList.add("hidden")}
function modal(h){let x=document.getElementById("modal");x.innerHTML='<div class="modalbox">'+h+"</div>";x.classList.remove("hidden")}
function err(e){return({"auth/email-already-in-use":"এই email আগে থেকেই আছে। Login করুন।","auth/invalid-credential":"Email বা password ভুল।","auth/invalid-email":"সঠিক email দিন।","auth/weak-password":"Password কমপক্ষে 6 অক্ষরের দিন।","auth/network-request-failed":"Internet connection check করুন।"}[e?.code]||e?.message||"সমস্যা হয়েছে।")}
onAuthStateChanged(auth,async u=>{
  try{
    me=u;
    if(!u){renderAuth();return}
    let s=await getDoc(doc(db,"users",u.uid));
    if(s.exists()){profile={id:u.uid,...s.data()};renderApp()}
    else renderSetup();
  }catch(e){
    startupError(e);
  }
});
function renderAuth(){app.innerHTML=`<div class="auth"><div class="auth-card"><div class="brand">📒 MFS Hisab Cloud</div><p class="muted">দোকানের Cash, DSO ও Customer হিসাব এক জায়গায়।</p><div id="am" class="alert hidden"></div><label>Email</label><input id="e" type="email" placeholder="you@example.com"><label>Password</label><input id="p" type="password" placeholder="কমপক্ষে 6 অক্ষর"><div class="actions"><button class="btn primary" id="login">Login</button><button class="btn success" id="signup">New account / Owner</button></div><p class="note" style="margin-top:16px">প্রথম account Owner হবে। পরে Owner Dashboard থেকে DSO যোগ করা যাবে।</p></div></div>`;
login.onclick=async()=>{try{await signInWithEmailAndPassword(auth,e.value.trim(),p.value)}catch(x){am.textContent=err(x);am.classList.remove("hidden")}};
signup.onclick=async()=>{try{if(p.value.length<6)throw{code:"auth/weak-password"};let c=await createUserWithEmailAndPassword(auth,e.value.trim(),p.value);await setDoc(doc(db,"users",c.user.uid),{email:c.user.email,role:"owner",name:"Owner",createdAt:serverTimestamp()})}catch(x){am.textContent=err(x);am.classList.remove("hidden")}}}
function renderSetup(){app.innerHTML=`<div class="auth"><div class="auth-card"><h2>👤 Owner Profile</h2><p class="muted">আপনার দোকানের নাম/নিজের নাম দিন।</p><label>নাম</label><input id="n" placeholder="যেমন: Albhi"><button class="btn primary" style="width:100%;margin-top:18px" id="save">Continue</button></div></div>`;save.onclick=async()=>{await setDoc(doc(db,"users",me.uid),{email:me.email,role:"owner",name:n.value.trim()||"Owner",createdAt:serverTimestamp()});location.reload()}}
async function load(){let owner=profile.role==="owner"?me.uid:profile.ownerId;
let cq=profile.role==="owner"?query(collection(db,"customers"),where("ownerId","==",owner)):query(collection(db,"customers"),where("dsoId","==",me.uid));
let tq=profile.role==="owner"?query(collection(db,"transactions"),where("ownerId","==",owner)):query(collection(db,"transactions"),where("dsoId","==",me.uid));
let cs=await getDocs(cq),ts=await getDocs(tq);cache.customers=cs.docs.map(x=>({id:x.id,...x.data()}));cache.tx=ts.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).slice(0,300);
if(profile.role==="owner"){let ds=await getDocs(query(collection(db,"users"),where("ownerId","==",owner),where("role","==","dso")));cache.dsos=ds.docs.map(x=>({id:x.id,...x.data()}))}else cache.dsos=[]}
function renderApp(){app.innerHTML=`<header class="top"><div class="brand">📒 MFS Hisab Cloud</div><div class="row"><span class="muted">${esc(profile.name)} • ${profile.role==="owner"?"Owner":"DSO"}</span><button class="btn ghost small" id="logout">Logout</button></div></header><main class="wrap"><div id="toast" class="alert hidden"></div><div class="nav" id="nav"></div><div id="view"></div></main>`;logout.onclick=()=>signOut(auth);nav();go("dashboard")}
function nav(){let a=profile.role==="owner"?[["dashboard","🏠 Dashboard"],["customers","👥 Customers"],["dsos","👤 DSO"],["transactions","📒 Transactions"]]:[["dashboard","🏠 My Dashboard"],["customers","👥 Customers"],["transactions","📒 My Transactions"]];document.getElementById("nav").innerHTML=a.map(x=>`<button data-k="${x[0]}">${x[1]}</button>`).join("");document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>go(b.dataset.k))}
async function go(k){
  active=k;
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.k===k));
  try{await load();({dashboard:dash,customers:customers,dsos:dsos,transactions:transactions}[k])()}
  catch(e){view.innerHTML=`<div class="card"><h2>Firebase Database access error</h2><div class="alert">${esc(e?.message||e)}</div><p class="muted">Firebase Console → Firestore Database → Rules এ এই ZIP-এর <b>firestore.rules</b> code Publish করুন।</p></div>`}
}
function totals(){let i=0,o=0,d=0;cache.tx.forEach(t=>t.type==="cash_in"?i+=+t.amount:o+=+t.amount);cache.customers.forEach(c=>d+=+c.due||0);return{i,o,b:i-o,d}}
function dash(){let x=totals();view.innerHTML=`<div class="between"><div><h2>স্বাগতম, ${esc(profile.name)} 👋</h2><p class="muted">দোকানের হিসাব এক নজরে।</p></div><button class="btn primary" id="nt">+ Transaction</button></div><div class="grid stats section"><div class="card"><div class="stat-title">Cash In</div><div class="stat">${money(x.i)}</div></div><div class="card"><div class="stat-title">Cash Out</div><div class="stat">${money(x.o)}</div></div><div class="card"><div class="stat-title">Net Balance</div><div class="stat">${money(x.b)}</div></div><div class="card"><div class="stat-title">Customer Baki</div><div class="stat">${money(x.d)}</div></div></div><div class="grid two section"><div class="card"><h3>Quick Actions</h3><div class="grid two" style="margin-top:12px"><button class="btn success" id="ci">💰 Cash In</button><button class="btn danger" id="co">💸 Cash Out</button><button class="btn ghost" id="ac">👥 Customer</button>${profile.role==="owner"?'<button class="btn ghost" id="ad">👤 DSO</button>':""}</div></div><div class="card"><h3>Recent</h3>${cache.tx.slice(0,6).map(row).join("")||'<p class="muted">কোনো transaction নেই।</p>'}</div></div>`;nt.onclick=()=>tx();ci.onclick=()=>tx("cash_in");co.onclick=()=>tx("cash_out");ac.onclick=customerModal;if(ad)ad.onclick=dsoModal}
function row(t){return`<div class="between" style="padding:9px 0;border-bottom:1px solid var(--b)"><div><b>${esc(t.title||"Transaction")}</b><div class="note">${date(t.createdAt)}</div></div><span class="badge ${t.type==="cash_in"?"in":"out"}">${t.type==="cash_in"?"+":"-"} ${money(t.amount)}</span></div>`}
function customers(){view.innerHTML=`<div class="between"><div><h2>Customer Baki</h2><p class="muted">দেনা-পাওনা রাখুন।</p></div><button class="btn primary" id="addc">+ Customer</button></div><div class="card section"><table><thead><tr><th>নাম</th><th>মোবাইল</th><th>বাকি</th><th>নোট</th><th></th></tr></thead><tbody>${cache.customers.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.phone||"-")}</td><td><b>${money(c.due)}</b></td><td>${esc(c.note||"-")}</td><td><button class="btn ghost small" data-edit="${c.id}">Edit</button></td></tr>`).join("")||'<tr><td colspan="5" class="muted">কোনো customer নেই।</td></tr>'}</tbody></table></div>`;addc.onclick=customerModal;document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>customerModal(cache.customers.find(c=>c.id===b.dataset.edit)))}
function customerModal(c=null){modal(`<div class="between"><h3>${c?"Edit":"Add"} Customer</h3><button class="btn ghost small" id="x">✕</button></div><label>নাম</label><input id="cn" value="${esc(c?.name||"")}"><label>মোবাইল</label><input id="cp" value="${esc(c?.phone||"")}"><label>বাকি</label><input id="cd" type="number" value="${c?.due||0}"><label>নোট</label><textarea id="cno">${esc(c?.note||"")}</textarea><button class="btn primary" style="width:100%;margin-top:16px" id="sc">Save</button>`);x.onclick=close;sc.onclick=async()=>{let d={ownerId:profile.role==="owner"?me.uid:profile.ownerId,dsoId:profile.role==="dso"?me.uid:(c?.dsoId||null),name:cn.value.trim(),phone:cp.value.trim(),due:+cd.value||0,note:cno.value.trim(),updatedAt:serverTimestamp()};if(!d.name)return toast("নাম দিন");c?await updateDoc(doc(db,"customers",c.id),d):await addDoc(collection(db,"customers"),{...d,createdAt:serverTimestamp()});close();go("customers")}}
function dsos(){view.innerHTML=`<div class="between"><div><h2>DSO Management</h2><p class="muted">DSO account তৈরি করুন।</p></div><button class="btn primary" id="addd">+ Add DSO</button></div><div class="card section"><table><thead><tr><th>নাম</th><th>Email</th><th>মোবাইল</th></tr></thead><tbody>${cache.dsos.map(d=>`<tr><td><b>${esc(d.name)}</b></td><td>${esc(d.email)}</td><td>${esc(d.phone||"-")}</td></tr>`).join("")||'<tr><td colspan="3" class="muted">কোনো DSO নেই।</td></tr>'}</tbody></table></div>`;addd.onclick=dsoModal}
function dsoModal(){modal(`<div class="between"><h3>নতুন DSO Account</h3><button class="btn ghost small" id="x">✕</button></div><p class="note">DSO এই email/password দিয়ে ফোন থেকে login করবে।</p><label>DSO নাম</label><input id="dn"><label>DSO Email</label><input id="de" type="email"><label>Password</label><input id="dp" type="password"><label>মোবাইল</label><input id="dph"><button class="btn success" style="width:100%;margin-top:16px" id="sd">Create DSO</button>`);x.onclick=close;sd.onclick=async()=>{try{let a=initializeApp(firebaseConfig,"secondary"+Date.now()),au=getAuth(a),c=await createUserWithEmailAndPassword(au,de.value.trim(),dp.value);await setDoc(doc(db,"users",c.user.uid),{email:de.value.trim(),name:dn.value.trim(),phone:dph.value.trim(),role:"dso",ownerId:me.uid,createdAt:serverTimestamp()});await signOut(au);close();toast("DSO account তৈরি হয়েছে।",true);go("dsos")}catch(e){toast(err(e))}}}
function transactions(){view.innerHTML=`<div class="between"><div><h2>Transactions</h2><p class="muted">Cash In / Cash Out history.</p></div><button class="btn primary" id="addt">+ Transaction</button></div><div class="card section"><table><thead><tr><th>সময়</th><th>বিবরণ</th><th>ধরন</th><th>পরিমাণ</th></tr></thead><tbody>${cache.tx.map(t=>`<tr><td>${date(t.createdAt)}</td><td><b>${esc(t.title||"-")}</b><div class="note">${esc(t.note||"")}</div></td><td><span class="badge ${t.type==="cash_in"?"in":"out"}">${t.type==="cash_in"?"Cash In":"Cash Out"}</span></td><td><b>${money(t.amount)}</b></td></tr>`).join("")||'<tr><td colspan="4" class="muted">কোনো transaction নেই।</td></tr>'}</tbody></table></div>`;addt.onclick=()=>tx()}
function tx(type="cash_in"){modal(`<div class="between"><h3>New Transaction</h3><button class="btn ghost small" id="x">✕</button></div><label>ধরন</label><select id="tt"><option value="cash_in" ${type==="cash_in"?"selected":""}>Cash In (+)</option><option value="cash_out" ${type==="cash_out"?"selected":""}>Cash Out (-)</option></select><label>পরিমাণ</label><input id="ta" type="number" min="0" placeholder="5000"><label>বিবরণ</label><input id="ti" placeholder="যেমন: DSO থেকে টাকা পেলাম"><label>নোট</label><textarea id="tn"></textarea><button class="btn primary" style="width:100%;margin-top:16px" id="st">Save Transaction</button>`);x.onclick=close;st.onclick=async()=>{let a=+ta.value;if(a<=0)return toast("সঠিক amount দিন");await addDoc(collection(db,"transactions"),{ownerId:profile.role==="owner"?me.uid:profile.ownerId,dsoId:profile.role==="dso"?me.uid:null,dsoName:profile.role==="dso"?profile.name:null,type:tt.value,amount:a,title:ti.value.trim()||"Transaction",note:tn.value.trim(),createdAt:serverTimestamp()});close();go(active)}}
</script></body></html>
